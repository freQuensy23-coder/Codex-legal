name: Validate Codex Legal runtime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-codex-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Codex Legal
        uses: actions/checkout@v4

      - name: Install exact Codex 0.152.1 release
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/openai/codex/releases/download/rust-v0.152.1/codex-x86_64-unknown-linux-musl.tar.gz"
          expected="a0ed1b40b1d597b340f09ae00ecebc46670b06cb52aac315b9dc84fed0289fd0"
          curl -fL --retry 4 --retry-all-errors -o /tmp/codex.tgz "$url"
          echo "$expected  /tmp/codex.tgz" | sha256sum -c -
          mkdir -p /tmp/codex-release
          tar -xzf /tmp/codex.tgz -C /tmp/codex-release
          codex_bin="$(find /tmp/codex-release -maxdepth 2 -type f -name 'codex*' ! -name '*.sigstore' | head -n 1)"
          test -n "$codex_bin"
          chmod +x "$codex_bin"
          "$codex_bin" --version | tee /tmp/codex-version.txt
          grep -q '0.152.1' /tmp/codex-version.txt
          echo "CODEX_BIN=$codex_bin" >> "$GITHUB_ENV"

      - name: Create isolated Codex home
        shell: bash
        run: |
          set -euo pipefail
          test_home="$(mktemp -d)"
          echo "TEST_HOME=$test_home" >> "$GITHUB_ENV"
          echo "CODEX_HOME=$test_home/.codex" >> "$GITHUB_ENV"
          mkdir -p "$test_home/.codex"

      - name: Build and install all legal plugins locally
        shell: bash
        env:
          HOME: ${{ env.TEST_HOME }}
          CODEX_HOME: ${{ env.CODEX_HOME }}
          CODEX_BIN: ${{ env.CODEX_BIN }}
        run: |
          set -euo pipefail
          bash scripts/install_codex_legal.sh

      - name: Exhaustive real Codex runtime validation
        env:
          HOME: ${{ env.TEST_HOME }}
          CODEX_HOME: ${{ env.CODEX_HOME }}
          CODEX_BIN: ${{ env.CODEX_BIN }}
        run: |
          set -euo pipefail
          python3 scripts/test_real_codex_runtime.py \
            --codex "$CODEX_BIN" \
            --codex-home "$CODEX_HOME" | tee runtime-validation.log
          grep -q 'RUNTIME_VALIDATION_OK' runtime-validation.log

      - name: Assert no Managed Agents runtime is wired in
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'codex_managed_agents|deploy-managed-agent|Managed Agents API' \
            scripts/install_codex_legal.sh scripts/build_codex_marketplace.py scripts/test_real_codex_runtime.py

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-legal-runtime-validation
          path: runtime-validation.log
          if-no-files-found: ignore
